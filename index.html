<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChairShare - Condivisione Postazioni & Saloni</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS per la Mappa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FontAwesome Icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Fix CSS specifico per i Popup di Leaflet */
    .leaflet-popup-content-wrapper {
      padding: 12px !important;
      border-radius: 12px !important;
      max-width: 280px !important;
      min-width: 220px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
    }
    .leaflet-popup-content {
      margin: 8px 12px 8px 8px !important;
      line-height: 1.4 !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      top: 8px !important;
      right: 8px !important;
      padding: 4px !important;
      color: #6b7280 !important;
      font-size: 16px !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- HEADER / NAVBAR -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-[#ff385c] fa-chair text-2xl text-rose-500"></i>
        <span class="text-2xl font-bold text-rose-500 tracking-tight">ChairShare</span>
      </div>

      <div id="user-nav" class="flex items-center space-x-3">
        <div id="auth-guest-links" class="flex items-center space-x-2">
          <button onclick="openModal('login-modal')" class="text-sm font-medium px-3 py-2 text-gray-700 hover:text-rose-500">Accedi</button>
          <button onclick="openModal('register-modal')" class="text-sm font-medium bg-rose-500 text-white px-4 py-2 rounded-lg hover:bg-rose-600 transition">Registrati</button>
        </div>
        <div id="auth-user-links" class="hidden items-center space-x-3">
          <span id="user-display-name" class="text-sm font-semibold text-gray-700"></span>
          <button onclick="gestisciLogout()" class="text-sm text-gray-500 hover:text-red-600"><i class="fa-solid fa-right-from-bracket"></i> Esci</button>
        </div>
      </div>
    </div>
  </header>

  <!-- BANNER PROMO -->
  <div class="bg-rose-50 text-rose-700 text-center py-2 px-4 text-xs sm:text-sm font-medium">
    "Metti in mostra il tuo spazio o trova la postazione ideale: contatta direttamente l'Host senza intermediari."
  </div>

  <!-- BARRACCIA RICERCA & FILTRI -->
  <section class="max-w-7xl mx-auto px-4 py-4 w-full">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-3 items-center">
      
      <!-- Campo Città -->
      <div class="relative w-full md:w-1/3">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
        <input type="text" id="filter-city" placeholder="Città (es. Napoli)" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>

      <!-- Prezzo Massimo -->
      <div class="w-full md:w-1/3">
        <select id="filter-price" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-rose-500">
          <option value="">Qualsiasi prezzo</option>
          <option value="30">Fino a 30€ / giorno</option>
          <option value="50">Fino a 50€ / giorno</option>
          <option value="100">Fino a 100€ / giorno</option>
        </select>
      </div>

      <!-- Pulsanti Cerca / Azzera -->
      <div class="flex w-full md:w-auto gap-2">
        <button onclick="applicaFiltri()" class="flex-1 md:flex-none bg-rose-500 text-white px-5 py-2 rounded-lg font-medium text-sm hover:bg-rose-600 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-magnifying-glass"></i> Cerca
        </button>
        <button onclick="azzeraFiltri()" class="text-xs text-gray-500 hover:text-rose-500 px-2 py-2 underline">
          Azzera Filtri
        </button>
      </div>
    </div>

    <!-- CATEGORIE (SELETTORI) -->
    <div class="flex items-center gap-4 mt-4 overflow-x-auto pb-2 scrollbar-hide">
      <button onclick="selezionaCategoria('all')" class="cat-btn active bg-gray-900 text-white px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 transition" data-cat="all">
        <i class="fa-solid fa-border-all"></i> Tutti gli Spazi
      </button>
      <button onclick="selezionaCategoria('Psicoterapia')" class="cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition" data-cat="Psicoterapia">
        <i class="fa-solid fa-brain text-purple-500"></i> Psicoterapia
      </button>
      <button onclick="selezionaCategoria('Massaggi')" class="cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition" data-cat="Massaggi">
        <i class="fa-solid fa-spa text-teal-500"></i> Massaggi
      </button>
      <button onclick="selezionaCategoria('Hair & Barber')" class="cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition" data-cat="Hair & Barber">
        <i class="fa-solid fa-scissors text-amber-500"></i> Hair & Barber
      </button>
      <button onclick="selezionaCategoria('Estetica & Nails')" class="cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition" data-cat="Estetica & Nails">
        <i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> Estetica & Nails
      </button>
      <button onclick="selezionaCategoria('Foto & Video')" class="cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition" data-cat="Foto & Video">
        <i class="fa-solid fa-camera text-blue-500"></i> Foto & Video
      </button>
    </div>
  </section>

  <!-- CONTENUTO PRINCIPALE (GRIGLIA & MAPPA) -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LISTA CARD SPAZI (Left) -->
    <section class="lg:col-span-7 flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 id="spazi-count" class="text-sm font-bold text-gray-700">0 spazi trovati</h2>
      </div>

      <div id="spazi-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Card dinamiche generate da JS -->
      </div>
    </section>

    <!-- MAPPA LEAFLET (Right) -->
    <section class="lg:col-span-5 h-[450px] lg:h-[600px] sticky top-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
      <div id="map" class="w-full h-full"></div>
    </section>
  </main>

  <!-- MODALI LOGIN / REGISTRAZIONE -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full relative">
      <button onclick="closeModal('login-modal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-lg font-bold mb-4">Accedi a ChairShare</h3>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
        <input type="email" id="login-email" placeholder="Email" required class="w-full p-2 border border-gray-300 rounded-lg text-sm">
        <input type="password" id="login-password" placeholder="Password" required class="w-full p-2 border border-gray-300 rounded-lg text-sm">
        <button type="submit" class="w-full bg-rose-500 text-white py-2 rounded-lg font-medium text-sm hover:bg-rose-600">Accedi</button>
      </form>
    </div>
  </div>

  <div id="register-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full relative">
      <button onclick="closeModal('register-modal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-lg font-bold mb-4">Crea un Account</h3>
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3">
        <input type="text" id="reg-fullname" placeholder="Nome e Cognome" required class="w-full p-2 border border-gray-300 rounded-lg text-sm">
        <input type="email" id="reg-email" placeholder="Email" required class="w-full p-2 border border-gray-300 rounded-lg text-sm">
        <input type="password" id="reg-password" placeholder="Password (min 6 car.)" required minlength="6" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
        <button type="submit" class="w-full bg-rose-500 text-white py-2 rounded-lg font-medium text-sm hover:bg-rose-600">Registrati</button>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Configurazione Supabase (Aggiorna con i tuoi dati veri se necessario)
    const SUPABASE_URL = 'https://chairshare.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOi...';
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {
      console.warn("Supabase non inizializzato, modalità mockup attiva.", e);
    }

    // Dati Locali di Fallback
    const localSpazi = [
      {
        id: "1",
        title: "Barberia Napoletana Spaccanapoli",
        category: "Hair & Barber",
        city: "Napoli",
        address: "Via Toledo 12, Napoli",
        price_per_day: 35,
        lat: 40.8438,
        lng: 14.2488,
        image: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500&auto=format&fit=crop"
      },
      {
        id: "2",
        title: "Studio Fotografico Vesuvio Light",
        category: "Foto & Video",
        city: "Napoli",
        address: "Corso Umberto I, Napoli",
        price_per_day: 45,
        lat: 40.8480,
        lng: 14.2600,
        image: "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?w=500&auto=format&fit=crop"
      },
      {
        id: "3",
        title: "Centro Massaggi & Olistica Chiaia",
        category: "Massaggi",
        city: "Napoli",
        address: "Via Chiaia 45, Napoli",
        price_per_day: 50,
        lat: 40.8350,
        lng: 14.2420,
        image: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=500&auto=format&fit=crop"
      }
    ];

    let currentCategory = 'all';
    let map = null;
    let mapMarkers = [];

    // Inizializzazione al caricamento
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      caricaEVisualizzaSpazi();
    });

    // Sanitizzazione XSS
    function sanitize(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // Inizializzazione Mappa Leaflet
    function initMap() {
      // Coordinate iniziali Napoli
      map = L.map('map').setView([40.8518, 14.2681], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    // Filtra e Mostra Spazi
    async function caricaEVisualizzaSpazi() {
      let spazi = localSpazi;

      // Tentativo di caricamento da Supabase
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('spazi').select('*');
          if (!error && data && data.length > 0) {
            spazi = data;
          }
        } catch(e) {
          console.log("Uso dati locali di backup");
        }
      }

      // Applica Filtri
      const cityVal = document.getElementById('filter-city').value.toLowerCase().trim();
      const priceVal = parseFloat(document.getElementById('filter-price').value);

      const spaziFiltrati = spazi.filter(item => {
        const matchCat = (currentCategory === 'all' || item.category === currentCategory);
        const matchCity = !cityVal || (item.city && item.city.toLowerCase().includes(cityVal)) || (item.address && item.address.toLowerCase().includes(cityVal));
        const matchPrice = !priceVal || item.price_per_day <= priceVal;
        return matchCat && matchCity && matchPrice;
      });

      renderListaSpazi(spaziFiltrati);
      renderMappaMarkers(spaziFiltrati);
    }

    // Renderizza la Lista
    function renderListaSpazi(lista) {
      const container = document.getElementById('spazi-container');
      const countEl = document.getElementById('spazi-count');
      container.innerHTML = '';
      countEl.textContent = `${lista.length} spazi trovati`;

      if (lista.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500 text-sm">Nessun risultato trovato per i filtri selezionati.</div>';
        return;
      }

      lista.forEach(spazio => {
        const imgUrl = (spazio.images && spazio.images.length > 0) ? spazio.images[0] : (spazio.image || 'https://via.placeholder.com/400x250?text=ChairShare');
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl overflow-hidden border border-gray-200 shadow-sm hover:shadow-md transition flex flex-col';
        card.innerHTML = `
          <div class="h-40 w-full bg-gray-100 overflow-hidden relative">
            <img src="${sanitize(imgUrl)}" class="w-full h-full object-cover">
            <span class="absolute top-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-md text-xs font-bold text-rose-600">
              €${spazio.price_per_day}/giorno
            </span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-semibold tracking-wider uppercase text-rose-500">${sanitize(spazio.category || 'Postazione')}</span>
              <h3 class="font-bold text-sm text-gray-800 line-clamp-1 mt-0.5">${sanitize(spazio.title)}</h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-1"><i class="fa-solid fa-location-dot text-rose-400"></i> ${sanitize(spazio.address)}</p>
            </div>
            <div class="mt-3 flex gap-2">
              <button onclick="calcolaPercorso(${spazio.lat}, ${spazio.lng})" class="flex-1 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-2 rounded-lg font-medium flex items-center justify-center gap-1 transition">
                <i class="fa-solid fa-route text-rose-500"></i> Calcola Percorso
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Renderizza i Marker della Mappa
    function renderMappaMarkers(lista) {
      // Pulizia Marker esistenti
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];

      const bounds = [];

      lista.forEach(spazio => {
        if (spazio.lat && spazio.lng) {
          const marker = L.marker([spazio.lat, spazio.lng]).addTo(map);

          // Popup personalizzato con fix grafico e pulsante percorso
          const popupContent = `
            <div class="text-left">
              <h4 class="font-bold text-xs text-gray-800 pr-3">${sanitize(spazio.title)}</h4>
              <p class="text-xs text-rose-600 font-semibold mt-1">€${spazio.price_per_day}/giorno</p>
              <p class="text-[11px] text-gray-500 mt-0.5">${sanitize(spazio.address)}</p>
              <button onclick="calcolaPercorso(${spazio.lat}, ${spazio.lng})" class="mt-2 w-full bg-rose-500 text-white text-[11px] py-1 px-2 rounded font-medium hover:bg-rose-600 transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-diamond-turn-right"></i> Calcola Percorso
              </button>
            </div>
          `;

          marker.bindPopup(popupContent);
          mapMarkers.push(marker);
          bounds.push([spazio.lat, spazio.lng]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    // Funzione Calcolo Percorso (Geolocalizzazione)
    function calcolaPercorso(destLat, destLng) {
      if (!navigator.geolocation) {
        // Fallback se geolocalizzazione non supportata
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}`, '_blank');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          // Apre Google Maps con partenza dalla posizione dell'utente
          const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${destLat},${destLng}&travelmode=driving`;
          window.open(url, '_blank');
        },
        (error) => {
          // In caso di rifiuto permessi o errore GPS
          window.open(`https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}`, '_blank');
        }
      );
    }

    // Gestione Categorie
    function selezionaCategoria(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn active bg-gray-900 text-white px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 transition";
        } else {
          btn.className = "cat-btn bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-2 hover:border-rose-500 transition";
        }
      });
      caricaEVisualizzaSpazi();
    }

    function applicaFiltri() {
      caricaEVisualizzaSpazi();
    }

    function azzeraFiltri() {
      document.getElementById('filter-city').value = '';
      document.getElementById('filter-price').value = '';
      selezionaCategoria('all');
    }

    // Utilities Modali
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Mockup Auth Handlers
    function handleLogin(e) {
      e.preventDefault();
      alert("Accesso effettuato con successo!");
      closeModal('login-modal');
    }
    function handleRegister(e) {
      e.preventDefault();
      alert("Registrazione completata!");
      closeModal('register-modal');
    }
    function gestisciLogout() {
      alert("Logout effettuato.");
    }
  </script>
</body>
</html>
