<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChairShare - Trova e Prenota Spazi e Poltrone</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
    <!-- Logo & Reset Home con Geolocalizzazione Dispositivo -->
    <div onclick="resetToHome()" class="flex items-center gap-3 cursor-pointer group">
      <div class="bg-emerald-500 text-white p-2 rounded-xl flex items-center justify-center shadow-lg group-hover:bg-emerald-400 transition-all">
        <!-- Logo Poltrona Bianca SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-white" viewBox="0 0 24 24">
          <path d="M19 10h-1V7c0-1.65-1.35-3-3-3H9C7.35 4 6 5.35 6 7v3H5c-1.1 0-2 .9-2 2v5c0 .55.45 1 1 1h1v2c0 .55.45 1 1 1s1-.45 1-1v-2h12v2c0 .55.45 1 1 1s1-.45 1-1v-2h1c.55 0 1-.45 1-1v-5c0-1.1-.9-2-2-2zm-11-3c0-.55.45-1 1-1h6c.55 0 1 .45 1 1v3H8V7zm11 8H5v-3h14v3z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide text-white group-hover:text-emerald-400 transition-colors">ChairShare</h1>
        <span class="text-[10px] text-gray-400 block -mt-1">Piattaforma Spazi & Poltrone</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="hidden md:inline text-xs text-gray-400 bg-gray-900/60 px-3 py-1.5 rounded-full border border-gray-700">
        Commissioni: <strong class="text-emerald-400">5% Guest</strong> • <strong class="text-emerald-400">10% Host</strong>
      </span>

      <!-- Stato Utente & Pulsanti -->
      <div id="authActions" class="flex items-center gap-2">
        <button onclick="toggleAuthModal(true)" id="loginBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-3.5 py-2 rounded-lg text-sm transition-colors">
          Accedi / Registrati
        </button>
        <button onclick="toggleModal('addModal', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2 shadow-lg shadow-emerald-900/20">
          <span>+</span> Aggiungi Poltrona
        </button>
      </div>

      <!-- Menu Utente Loggato -->
      <div id="userProfileActions" class="hidden items-center gap-2">
        <button onclick="mostraPagina('profilePage')" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3.5 py-2 rounded-lg text-sm transition-colors flex items-center gap-1.5 shadow-md">
          <span>👤</span> Area Personale
        </button>
        <button onclick="logout()" class="text-xs text-gray-400 hover:text-red-400 px-2 py-1">
          Esci
        </button>
      </div>
    </div>
  </header>

  <!-- VISTA 1: HOME PAGE (Mappa & Ricerca) -->
  <div id="homePage" class="flex-1 flex flex-col">
    <!-- Hero Banner -->
    <section class="bg-gradient-to-b from-gray-800 to-gray-900 border-b border-gray-800 py-4 px-4 text-center">
      <h2 class="text-xl md:text-2xl font-extrabold text-white mb-1 tracking-tight">
        Trova e prenota la tua poltrona o spazio ideale
      </h2>
      <p class="text-emerald-400 text-xs md:text-sm font-medium max-w-2xl mx-auto">
        Registrazione gratuita • Zero canoni mensili • Paghi solo quando lavori
      </p>
    </section>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 overflow-hidden relative">
      <!-- Sidebar / Filtri & Risultati -->
      <div class="lg:col-span-5 p-4 overflow-y-auto flex flex-col gap-4 max-h-[calc(100vh-170px)]">
        <!-- Box Ricerca -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
          <h3 class="text-base font-semibold mb-3 flex items-center gap-2">
            🔍 Cerca la tua postazione
          </h3>
          
          <div class="space-y-3">
            <div>
              <label class="text-xs text-gray-400 uppercase font-medium">Città / Posizione</label>
              <input id="cityInput" type="text" placeholder="Es. Napoli, Milano, Roma..." class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white" />
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs text-gray-400 uppercase font-medium">Tipo Spazio</label>
                <select id="typeSelect" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                  <option value="">Tutti</option>
                  <option value="barbiere">Barbiere / Parrucchiere</option>
                  <option value="fotografia">Studio Fotografico</option>
                  <option value="estetica">Centro Estetico</option>
                </select>
              </div>
              <div>
                <label class="text-xs text-gray-400 uppercase font-medium">Prezzo Max (€/giorno)</label>
                <input id="priceInput" type="number" placeholder="Es. 80" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white" />
              </div>
            </div>

            <button onclick="cercaSpazi()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-md">
              Cerca sulla Mappa
            </button>
          </div>
        </div>

        <!-- Risultati / Lista Spazi -->
        <div class="flex-1">
          <h3 class="text-sm font-semibold text-gray-400 mb-2">Spazi e Poltrone Disponibili (<span id="resultsCount">0</span>)</h3>
          <div id="spacesList" class="flex flex-col gap-3">
            <!-- Schede dinamiche -->
          </div>
        </div>
      </div>

      <!-- Mappa Interattiva -->
      <div class="lg:col-span-7 h-[400px] lg:h-full relative z-0">
        <div id="map" class="w-full h-full"></div>
      </div>
    </main>
  </div>

  <!-- VISTA 2: AREA PERSONALE FULL-PAGE -->
  <div id="profilePage" class="hidden flex-1 bg-gray-900 p-4 md:p-8 overflow-y-auto">
    <div class="max-w-5xl mx-auto space-y-6">
      
      <!-- Top Bar Area Personale -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl gap-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-2xl font-bold text-white">Area Personale Profilo</h2>
            <span id="userRoleBadge" class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/3
